name: 刷新数据并部署

# 数据刷新时间（cron 是 UTC，对应北京时间 09:00–15:59 的工作日）
# GitHub 的定时任务在高峰期可能延迟几分钟，属于正常现象。
on:
  schedule:
    - cron: '*/30 1-7 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write     # 需要提交 data/history.json
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 关键：按分支的最新提交检出，而不是按「触发事件当时的快照」。
      # 否则排队等待的任务会拿到落后的基准，回写历史时必然被远端拒绝。
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取行情并生成静态站点
        run: node scripts/snapshot.mjs

      # 历史回写只是顺手存档，失败绝不能挡住部署，所以做了两层保护：
      #   1. continue-on-error —— 推送失败也继续往下走，网站照常部署
      #   2. pull --rebase + 重试 —— 处理远端已被另一个任务推进的情况
      - name: 把历史数据提交回仓库
        continue-on-error: true
        run: |
          set -u
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/history.json
          if git diff --staged --quiet; then
            echo "历史无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 更新历史数据 $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"

          BRANCH="${GITHUB_REF_NAME}"
          for i in 1 2 3 4 5; do
            echo "--- 第 $i 次尝试推送 ---"
            if git pull --rebase --autostash origin "$BRANCH"; then
              if git push origin "HEAD:$BRANCH"; then
                echo "历史数据已推送"
                exit 0
              fi
            else
              echo "rebase 有冲突，保留本次刚生成的历史文件"
              git checkout --theirs data/history.json 2>/dev/null || true
              git add data/history.json
              GIT_EDITOR=true git rebase --continue || git rebase --skip || git rebase --abort || true
            fi
            sleep 3
          done

          echo "::warning::历史数据推送失败，本次跳过。网站照常部署，下一次任务会自动补上。"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
