name: 刷新数据并部署

# 数据刷新时间（cron 是 UTC，对应北京时间 09:00–15:59 的工作日）
# GitHub 的定时任务在高峰期可能延迟几分钟，属于正常现象。
on:
  schedule:
    - cron: '*/30 1-7 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write     # 需要提交 data/history.json
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取行情并生成静态站点
        run: node scripts/snapshot.mjs

      - name: 把历史数据提交回仓库
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          if git diff --staged --quiet; then
            echo "历史无变化，跳过提交"
          else
            git commit -m "chore: 更新历史数据 $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
